# path: borrow-service/src/main/resources/application.properties
# purpose: cấu hình cổng chạy, database và quy tắc nghiệp vụ mượn trả cho borrow-service

spring.application.name=borrow-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/lib_borrow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

book-service.base-url=http://localhost:8082

# Quy tắc nghiệp vụ
borrow.loan-days=14
borrow.max-active-loans=5
# Mỗi phiếu được gia hạn tối đa số lần này khi chưa quá hạn và không còn nợ phạt
borrow.max-renewals=1
borrow.fine-per-day=5000
borrow.maintenance-cron=0 0 2 * * *

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# phải GIỐNG HỆT jwt.secret của auth-service
jwt.secret=Library-Microservices-Secret-Key-Bai-Tap-Lon-SOA-2026-Quan-Ly-Thu-Vien
