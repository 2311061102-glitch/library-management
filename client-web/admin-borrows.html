<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quan ly muon/tra sach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 220px; min-height: 100vh; }
        .sidebar .nav-link { color: #ced4da; }
        .sidebar .nav-link.active { color: #fff; background-color: #495057; border-radius: 6px; }
        .sidebar .nav-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">

    <!-- Sidebar -->
    <nav class="sidebar bg-dark p-3">
        <h5 class="text-white mb-4">Thu vien - Admin</h5>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="admin-books.html" class="nav-link">Quan ly Sach</a></li>
            <li class="nav-item"><a href="admin-categories.html" class="nav-link">Quan ly Danh muc</a></li>
            <li class="nav-item"><a href="admin-borrows.html" class="nav-link active">Quan ly Muon/Tra</a></li>
            <li class="nav-item"><a href="admin-users.html" class="nav-link">Quan ly Doc gia</a></li>
        </ul>
        <hr class="text-secondary">
        <div id="welcomeText" class="text-white small mb-2"></div>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Dang xuat</button>
    </nav>

    <!-- Nội dung chính -->
    <main class="flex-grow-1 p-4">
        <h2 class="mb-4">Quan ly Muon/Tra sach</h2>

        <div class="mb-3" style="max-width: 400px;">
            <input type="text" id="searchBorrow" class="form-control" placeholder="Tim theo ten doc gia hoac ten sach...">
        </div>

        <h5>Danh sach phieu muon</h5>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Nguoi muon</th>
                <th>Sach</th>
                <th>Ngay muon</th>
                <th>Han tra</th>
                <th>Trang thai</th>
                <th>Thao tac</th>
            </tr>
            </thead>
            <tbody id="borrowList"></tbody>
        </table>

        <h5 class="mt-4">Danh sach phieu phat</h5>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Nguoi bi phat</th>
                <th>Ly do</th>
                <th>So tien</th>
                <th>Trang thai</th>
                <th>Thao tac</th>
            </tr>
            </thead>
            <tbody id="fineList"></tbody>
        </table>
    </main>
</div>

<script src="admin-borrows.js"></script>
</body>
</html>
