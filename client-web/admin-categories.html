<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quan ly danh muc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 220px; min-height: 100vh; }
        .sidebar .nav-link { color: #ced4da; }
        .sidebar .nav-link.active { color: #fff; background-color: #495057; border-radius: 6px; }
        .sidebar .nav-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">

    <!-- Sidebar -->
    <nav class="sidebar bg-dark p-3">
        <h5 class="text-white mb-4">Thu vien - Admin</h5>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="admin-books.html" class="nav-link">Quan ly Sach</a></li>
            <li class="nav-item"><a href="admin-categories.html" class="nav-link active">Quan ly Danh muc</a></li>
            <li class="nav-item"><a href="admin-borrows.html" class="nav-link">Quan ly Muon/Tra</a></li>
            <li class="nav-item"><a href="admin-users.html" class="nav-link">Quan ly Doc gia</a></li>
        </ul>
        <hr class="text-secondary">
        <div id="welcomeText" class="text-white small mb-2"></div>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Dang xuat</button>
    </nav>

    <!-- Nội dung chính -->
    <main class="flex-grow-1 p-4">
        <h2 class="mb-4">Quan ly Danh muc</h2>

        <div class="mb-3" style="max-width: 400px;">
            <input type="text" id="searchCategory" class="form-control" placeholder="Tim theo ten danh muc...">
        </div>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Ten danh muc</th>
                <th>So sach</th>
                <th style="width: 200px;">Thao tac</th>
            </tr>
            </thead>
            <tbody id="categoryList"></tbody>
        </table>

        <div class="mt-4" style="max-width: 400px;">
            <h5 id="formTitle">Them danh muc moi</h5>
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                <div class="mb-3">
                    <label class="form-label">Ten danh muc</label>
                    <input type="text" class="form-control" id="categoryName" required>
                </div>
                <button type="submit" class="btn btn-primary">Luu</button>
                <button type="button" class="btn btn-secondary" id="resetBtn">Lam moi</button>
            </form>
        </div>
    </main>
</div>

<script src="admin-categories.js"></script>
</body>
</html>
