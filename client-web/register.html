<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dang ky - Thu vien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="max-width: 420px; width: 100%;">
        <h4 class="mb-3 text-center">Dang ky tai khoan doc gia</h4>

        <div class="mb-3">
            <label class="form-label">Ho ten</label>
            <input type="text" id="fullName" class="form-control" placeholder="Nhap ho ten">
        </div>

        <div class="mb-3">
            <label class="form-label">Ten dang nhap</label>
            <input type="text" id="username" class="form-control" placeholder="Nhap ten dang nhap">
        </div>

        <div class="mb-3">
            <label class="form-label">Mat khau</label>
            <input type="password" id="password" class="form-control" placeholder="Nhap mat khau">
        </div>

        <div class="mb-3">
            <label class="form-label">Nhap lai mat khau</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Nhap lai mat khau">
        </div>

        <div class="mb-3">
            <label class="form-label">MSSV (khong bat buoc)</label>
            <input type="text" id="studentCode" class="form-control" placeholder="Nhap MSSV neu co">
        </div>

        <button id="registerBtn" class="btn btn-primary w-100">Dang ky</button>
        <div id="registerError" class="text-danger mt-3 text-center"></div>
        <div id="registerSuccess" class="text-success mt-3 text-center"></div>

        <p class="text-center mt-3 mb-0">
            Da co tai khoan? <a href="login.html">Dang nhap ngay</a>
        </p>
    </div>
</div>
<script src="register.js"></script>
</body>
</html>
