<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ho so ca nhan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Ho so ca nhan</h3>
        <div>
            <a href="index.html" class="btn btn-outline-primary btn-sm me-2">Danh sach sach</a>
            <a href="my-borrows.html" class="btn btn-outline-primary btn-sm me-2">Sach da muon</a>
            <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Dang xuat</button>
        </div>
    </div>

    <div class="row">
        <!-- Cập nhật thông tin -->
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h5>Thong tin ca nhan</h5>
                <form id="profileForm">
                    <div class="mb-3">
                        <label class="form-label">Ho ten</label>
                        <input type="text" class="form-control" id="profileFullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ten dang nhap</label>
                        <input type="text" class="form-control" id="profileUsername" disabled>
                        <small class="text-muted">Ten dang nhap khong the thay doi</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">MSSV</label>
                        <input type="text" class="form-control" id="profileStudentCode">
                    </div>
                    <button type="submit" class="btn btn-primary">Cap nhat thong tin</button>
                    <div id="profileMessage" class="mt-2"></div>
                </form>
            </div>
        </div>

        <!-- Đổi mật khẩu -->
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h5>Doi mat khau</h5>
                <form id="passwordForm">
                    <div class="mb-3">
                        <label class="form-label">Mat khau hien tai</label>
                        <input type="password" class="form-control" id="oldPassword" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mat khau moi</label>
                        <input type="password" class="form-control" id="newPassword" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhap lai mat khau moi</label>
                        <input type="password" class="form-control" id="confirmNewPassword" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Doi mat khau</button>
                    <div id="passwordMessage" class="mt-2"></div>
                </form>
            </div>
        </div>
    </div>

</div>
<script src="profile.js"></script>
</body>
</html>
