<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quan tri sach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 220px; min-height: 100vh; }
        .sidebar .nav-link { color: #ced4da; }
        .sidebar .nav-link.active { color: #fff; background-color: #495057; border-radius: 6px; }
        .sidebar .nav-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">

    <!-- Sidebar -->
    <nav class="sidebar bg-dark p-3">
        <h5 class="text-white mb-4">Thu vien - Admin</h5>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="admin-books.html" class="nav-link active">Quan ly Sach</a></li>
            <li class="nav-item"><a href="admin-categories.html" class="nav-link">Quan ly Danh muc</a></li>
            <li class="nav-item"><a href="admin-borrows.html" class="nav-link">Quan ly Muon/Tra</a></li>
            <li class="nav-item"><a href="admin-users.html" class="nav-link">Quan ly Doc gia</a></li>
        </ul>
        <hr class="text-secondary">
        <div id="welcomeText" class="text-white small mb-2"></div>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Dang xuat</button>
    </nav>

    <!-- Nội dung chính -->
    <main class="flex-grow-1 p-4">
        <h2 class="mb-4">Quan ly sach</h2>
        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="searchBook" class="form-control" placeholder="Tim theo ten sach...">
            </div>
            <div class="col-md-3">
                <select id="filterCategory" class="form-select">
                    <option value="">Tat ca danh muc</option>
                </select>
            </div>
        </div>
        <div class="row" id="bookList"></div>

        <div class="mt-5">
            <h4 id="formTitle">Them sach moi</h4>
            <form id="bookForm">
                <input type="hidden" id="bookId">

                <div class="mb-3">
                    <label class="form-label">Ten sach</label>
                    <input type="text" class="form-control" id="bookTitle" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tac gia</label>
                    <input type="text" class="form-control" id="bookAuthor" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mo ta</label>
                    <textarea class="form-control" id="bookDescription"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Danh muc</label>
                    <select class="form-select" id="bookCategory" required>
                        <option value="">-- Chon danh muc --</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tong so ban</label>
                        <input type="number" class="form-control" id="bookTotalCopies" required min="1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">So ban con lai</label>
                        <input type="number" class="form-control" id="bookAvailableCopies" required min="0">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Anh bia sach</label>
                    <input type="file" class="form-control" id="bookImage">
                </div>

                <button type="submit" class="btn btn-primary">Luu</button>
                <button type="button" class="btn btn-secondary" id="resetBtn">Lam moi</button>
            </form>
        </div>
    </main>
</div>

<script src="admin-books.js"></script>
</body>
</html>
