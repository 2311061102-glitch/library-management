<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sach sach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Danh sach sach</h3>
        <div id="authArea"></div>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Tim theo ten sach...">
        </div>
        <div class="col-md-3">
            <select id="categoryFilter" class="form-select">
                <option value="">Tat ca danh muc</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="sortSelect" class="form-select">
                <option value="">Sap xep...</option>
                <option value="title,asc">Ten A-Z</option>
                <option value="title,desc">Ten Z-A</option>
            </select>
        </div>
    </div>

    <div id="bookList" class="row g-3"></div>

    <nav class="mt-4">
        <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
</div>

<div class="modal fade" id="borrowModal" tabindex="-1" aria-labelledby="borrowModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="borrowModalLabel">Xac nhan muon sach</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Dong"></button>
            </div>
            <div class="modal-body" id="borrowModalBody">
                <div class="text-center py-3">
                    <div class="spinner-border spinner-border-sm" role="status"></div>
                    Dang kiem tra dieu kien muon...
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huy</button>
                <button type="button" class="btn btn-primary" id="confirmBorrowBtn" disabled>Xac nhan muon</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="books.js"></script>
</body>
</html>
