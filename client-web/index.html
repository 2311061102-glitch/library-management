<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sach sach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Danh sach sach</h3>
        <div id="authArea"></div>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Tim theo ten sach...">
        </div>
        <div class="col-md-3">
            <select id="categoryFilter" class="form-select">
                <option value="">Tat ca danh muc</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="sortSelect" class="form-select">
                <option value="">Sap xep...</option>
                <option value="title,asc">Ten A-Z</option>
                <option value="title,desc">Ten Z-A</option>
            </select>
        </div>
    </div>

    <div id="bookList" class="row g-3"></div>

    <nav class="mt-4">
        <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
</div>

<script src="books.js"></script>
</body>
</html>
