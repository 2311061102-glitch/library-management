<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dang nhap - Thu vien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h4 class="mb-3 text-center">Dang nhap Thu vien</h4>
        <div class="mb-3">
            <label for="username" class="form-label">Ten dang nhap</label>
            <input type="text" id="username" class="form-control" placeholder="Nhap ten dang nhap">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mat khau</label>
            <input type="password" id="password" class="form-control" placeholder="Nhap mat khau">
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Dang nhap</button>
        <div id="loginError" class="text-danger mt-3 text-center"></div>
        <p class="text-center mt-3 mb-0">
            Chua co tai khoan? <a href="register.html">Dang ky ngay</a>
        </p>
    </div>
</div>
<script src="login.js"></script>
</body>
</html>
