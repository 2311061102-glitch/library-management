spring.application.name=auth-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/lib_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# QUAN TRỌNG: chuỗi bí mật này phải GIỐNG HỆT nhau ở auth-service, book-service,
# borrow-service. Đây là điểm chung DUY NHẤT giữa các service về bảo mật.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
